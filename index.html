<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak for me</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak for me">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--fg:#111418;--soft:#5b6472;--card:#fff;--line:#d9dde4;--btn:#e8edf6;--btnfg:#10203d;--acc:#2563eb;--accfg:#fff;--stop:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#f2f4f7;--soft:#a3acb9;--card:#191c22;--line:#2c313a;--btn:#232a36;--btnfg:#eef3ff;--acc:#3b82f6;--stop:#ef4444}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 14px);max-width:720px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
h1 .sp{flex:1}
button{font:inherit;color:inherit;border:0;border-radius:16px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.p{position:relative;background:var(--btn);color:var(--btnfg);min-height:84px;padding:14px 12px;font-size:21px;font-weight:600;text-align:center;line-height:1.2}
.p:active,.p.on{background:var(--acc);color:var(--accfg)}
.p .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.18);color:inherit;font-size:20px;line-height:32px;padding:0}
.lbl{font-size:14px;color:var(--soft);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
textarea{width:100%;min-height:120px;font:inherit;font-size:22px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--fg);resize:vertical}
textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.big{flex:1 1 0;min-height:60px;font-size:20px;font-weight:700;padding:0 14px}
.speak{background:var(--acc);color:var(--accfg)}
.stop{background:var(--stop);color:#fff}
.sec{background:var(--btn);color:var(--btnfg)}
.small{min-height:48px;font-size:17px;font-weight:600;padding:0 14px;background:var(--btn);color:var(--btnfg)}
#stopTop{min-height:44px;padding:0 16px;font-size:17px;font-weight:700;background:var(--stop);color:#fff}
.recent{list-style:none;margin:0;padding:0}
.recent li button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:12px 14px;margin:0 0 8px;font-size:18px;border-radius:12px}
.recent li button:active{background:var(--acc);color:var(--accfg)}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
summary{font-size:17px;font-weight:600;padding:10px 0;cursor:pointer}
label{display:block;margin:10px 0;font-size:16px;color:var(--soft)}
select{width:100%;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-top:4px}
input[type=range]{width:100%;margin-top:6px;height:32px}
.warn{background:#fde68a;color:#3b2f00;padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:17px}
.hint{font-size:14px;color:var(--soft);margin:6px 2px 0}
</style>
</head>
<body>
<div id="unsupported" class="warn" hidden>Speech isn't available in this browser. Please open this page in Safari or Chrome.</div>
<h1><span class="sp">Speak for me</span><button id="stopTop" type="button">■ Stop</button></h1>
<div class="grid" id="presets"></div>

<div class="lbl">Type to speak</div>
<textarea id="txt" placeholder="Type here, then Speak (Enter). Shift+Enter for a new line." enterkeyhint="send" autocapitalize="sentences"></textarea>
<div class="row">
  <button class="big speak" id="speak" type="button">🔊 Speak</button>
  <button class="big stop" id="stop" type="button">■ Stop</button>
</div>
<div class="row">
  <button class="small" id="clear" type="button">Clear</button>
  <button class="small" id="save" type="button">+ Save as button</button>
</div>
<p class="hint">Long-press or tap × on your own buttons to remove them.</p>

<div id="recentWrap" hidden><div class="lbl">Recent</div><ul class="recent" id="recent"></ul></div>

<details id="settings">
  <summary>Voice</summary>
  <label>Voice<select id="voice"></select></label>
  <label>Speed <b id="rateV">1.0</b><input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1"></label>
  <label>Volume <b id="volV">100%</b><input type="range" id="vol" min="0" max="1" step="0.05" value="1"></label>
  <button class="small" id="test" type="button">Test voice</button>
  <p class="hint">No sound? On iPhone, check that the side switch isn't on silent and the volume is up.</p>
</details>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var LS={get:function(k,d){try{var v=localStorage.getItem("sfm-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("sfm-"+k,JSON.stringify(v))}catch(e){}}};
var BUILTIN=["Thank you","I love you","Yes, please","No, thank you","I'm on voice rest today","One more take","Sounds great!","Can you give me a minute?"];
var synth=window.speechSynthesis, ok=!!(synth&&window.SpeechSynthesisUtterance);
if(!ok)$("unsupported").hidden=false;
var settings=LS.get("settings",{voice:"",rate:1,vol:1});
var custom=LS.get("custom",[]), recent=LS.get("recent",[]);
var voices=[], current=null;

function pickDefault(){
  var en=voices.filter(function(v){return /^en[-_]US/i.test(v.lang)});
  var pool=en.length?en:voices.filter(function(v){return /^en/i.test(v.lang)});
  var names=["Aaron","Fred","Daniel","Alex"];
  for(var i=0;i<names.length;i++){for(var j=0;j<pool.length;j++){if(pool[j].name.indexOf(names[i])>=0)return pool[j]}}
  for(i=0;i<names.length;i++){for(j=0;j<voices.length;j++){if(/^en/i.test(voices[j].lang)&&voices[j].name.indexOf(names[i])>=0)return voices[j]}}
  return pool.filter(function(v){return v.default})[0]||pool[0]||voices.filter(function(v){return v.default})[0]||voices[0]||null;
}
function chosenVoice(){
  if(!voices.length)return null;
  for(var i=0;i<voices.length;i++){if(voices[i].voiceURI===settings.voice)return voices[i]}
  return pickDefault();
}
function loadVoices(){
  if(!ok)return;
  voices=synth.getVoices()||[];
  var sel=$("voice"),cv=chosenVoice();
  var list=voices.slice().sort(function(a,b){var ae=/^en/i.test(a.lang)?0:1,be=/^en/i.test(b.lang)?0:1;return ae-be||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name)});
  sel.innerHTML="";
  if(!list.length){var o=document.createElement("option");o.textContent="Default voice";o.value="";sel.appendChild(o);return}
  list.forEach(function(v){var o=document.createElement("option");o.value=v.voiceURI;o.textContent=v.name+" ("+v.lang+")";if(cv&&v.voiceURI===cv.voiceURI)o.selected=true;sel.appendChild(o)});
}

function speak(text,btn){
  text=(text||"").trim();if(!text)return;
  if(!ok){$("unsupported").hidden=false;return}
  if(synth.speaking||synth.pending)synth.cancel();
  var u=new SpeechSynthesisUtterance(text);
  var v=chosenVoice();u.lang=(v&&v.lang)||"en-US";if(v){try{u.voice=v}catch(e){}}
  u.rate=+settings.rate||1;u.volume=settings.vol==null?1:+settings.vol;u.pitch=1;
  current=u; // keep a reference so Safari doesn't drop it
  if(btn){btn.classList.add("on");var off=function(){btn.classList.remove("on")};u.onend=off;u.onerror=off}
  synth.speak(u);
  if(synth.paused)synth.resume();
}
function stop(){if(ok)synth.cancel();document.querySelectorAll(".p.on").forEach(function(b){b.classList.remove("on")})}

function renderPresets(){
  var g=$("presets");g.innerHTML="";
  BUILTIN.forEach(function(t){g.appendChild(mkBtn(t,-1))});
  custom.forEach(function(t,i){g.appendChild(mkBtn(t,i))});
}
function mkBtn(t,ci){
  var b=document.createElement("button");b.type="button";b.className="p";b.textContent=t;
  var lp=false,timer=null;
  b.addEventListener("click",function(e){if(e.target.classList.contains("x"))return;if(lp){lp=false;return}speak(t,b)});
  if(ci>=0){
    var x=document.createElement("span");x.className="x";x.textContent="×";x.setAttribute("role","button");x.setAttribute("aria-label","Remove "+t);
    x.addEventListener("click",function(e){e.stopPropagation();removeCustom(t)});b.appendChild(x);
    var start=function(){lp=false;clearTimeout(timer);timer=setTimeout(function(){lp=true;removeCustom(t)},650)};
    var cancel=function(){clearTimeout(timer)};
    b.addEventListener("touchstart",start,{passive:true});b.addEventListener("touchend",cancel);b.addEventListener("touchmove",cancel,{passive:true});
    b.addEventListener("mousedown",start);b.addEventListener("mouseup",cancel);b.addEventListener("mouseleave",cancel);
    b.addEventListener("contextmenu",function(e){e.preventDefault()});
  }
  return b;
}
function removeCustom(t){if(!confirm('Remove the "'+t+'" button?'))return;custom=custom.filter(function(c){return c!==t});LS.set("custom",custom);renderPresets()}

function addRecent(t){recent=[t].concat(recent.filter(function(r){return r!==t})).slice(0,5);LS.set("recent",recent);renderRecent()}
function renderRecent(){
  var ul=$("recent");ul.innerHTML="";$("recentWrap").hidden=!recent.length;
  recent.forEach(function(t){var li=document.createElement("li"),b=document.createElement("button");b.type="button";b.textContent=t;b.addEventListener("click",function(){speak(t,b)});li.appendChild(b);ul.appendChild(li)});
}
function speakTyped(){var t=$("txt").value.trim();if(!t)return;speak(t);addRecent(t)}

$("speak").addEventListener("click",speakTyped);
$("stop").addEventListener("click",stop);$("stopTop").addEventListener("click",stop);
$("clear").addEventListener("click",function(){$("txt").value="";$("txt").focus()});
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();speakTyped()}});
$("save").addEventListener("click",function(){var t=$("txt").value.trim();if(!t){$("txt").focus();return}
  if(BUILTIN.indexOf(t)<0&&custom.indexOf(t)<0){custom.push(t);LS.set("custom",custom);renderPresets()}});
$("voice").addEventListener("change",function(e){settings.voice=e.target.value;LS.set("settings",settings)});
$("rate").addEventListener("input",function(e){settings.rate=+e.target.value;$("rateV").textContent=(+e.target.value).toFixed(2).replace(/0$/,"");LS.set("settings",settings)});
$("vol").addEventListener("input",function(e){settings.vol=+e.target.value;$("volV").textContent=Math.round(e.target.value*100)+"%";LS.set("settings",settings)});
$("test").addEventListener("click",function(){speak("This is my voice for today.")});

$("rate").value=settings.rate;$("rateV").textContent=(+settings.rate).toFixed(2).replace(/0$/,"");
$("vol").value=settings.vol;$("volV").textContent=Math.round(settings.vol*100)+"%";
renderPresets();renderRecent();
if(ok){loadVoices();if("onvoiceschanged" in synth)synth.addEventListener?synth.addEventListener("voiceschanged",loadVoices):(synth.onvoiceschanged=loadVoices);setTimeout(loadVoices,500);setTimeout(loadVoices,1500)}
})();
</script>
</body>
</html>
